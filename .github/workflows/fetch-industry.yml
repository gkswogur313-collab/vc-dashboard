name: fetch-industry

on:
  schedule:
    - cron: "40 21 * * *"    # 매일 06:40 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-industry
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 산업 트래킹 — 연구기관·협회 리포트 게시판 수집
        run: node scripts/fetch-industry.mjs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: 새 리포트 본문·PDF 앞부분 텍스트 수집(주간 브리핑 재료)
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          node scripts/fetch-industry-text.mjs
        continue-on-error: true

      - name: public/data/industry.json 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/industry.json
          [ -f data/industry-text.json ] && git add data/industry-text.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            N=$(node -e "process.stdout.write(String(require('./public/data/industry.json').count))")
            git commit -m "chore(산업트래킹): 리포트 목록 갱신 (${N}건)"
            git pull --rebase
            git push
          fi
