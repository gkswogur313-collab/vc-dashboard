name: fetch-google-news

on:
  schedule:
    - cron: "0 */3 * * *"   # 3시간마다
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: fetch-google-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 구글 뉴스 수집
        run: node scripts/fetch-google-news.mjs

      - name: public/data/news-google.json 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news-google.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            COUNT=$(node -e "process.stdout.write(String(require('./public/data/news-google.json').total))")
            git commit -m "chore(news): 구글 뉴스 갱신 (${COUNT}건)"
            git pull --rebase
            git push
          fi
