name: fetch-dart-screener
# 매일 07:00 KST에 깨어나되, 실제 수집 여부는 스크립트가 판단한다.
#  · 5년치 백필이 끝나기 전: 매일 하루 한도만큼 수집
#  · 백필 완료 후: 4~6월 월요일에만 수집, 그 외에는 API 호출 없이 바로 종료
#  · 수동 실행(Run workflow): 언제든 수집
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      max_minutes:
        description: '최대 실행 시간(분) — 짧게 돌려 소싱 연결 회사 재파싱만 먼저 반영하려면 40 정도'
        required: false
        default: '290'
concurrency:
  group: dart-screener
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Crawl DART audit reports
        timeout-minutes: 305  # 크롤 단계만 먼저 끊어 Commit 단계가 반드시 실행되도록
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MAX_CALLS: '18000'   # OpenDART 일일 한도 2만 건 이내
          MAX_MINUTES: ${{ github.event.inputs.max_minutes || '290' }}   # 330분 제한 전에 멈추고 저장·커밋
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/fetch-dart-screener.py
      - name: Commit
        if: always()   # 취소·시간 초과 때도 그때까지 수집한 분량을 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/dart-screener.json public/data/dart-lp.json public/data/dart-index.json data/dart-cache.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(dart): 공시분석 데이터 갱신"
          git pull --rebase
          git push
