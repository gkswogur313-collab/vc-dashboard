name: fetch-funding
on:
  schedule:
    - cron: '0 23 * * *'   # 매일 08:00 KST
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Crawl funding (StartupRecipe)
        run: node scripts/fetch-funding.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/funding.json
          git diff --staged --quiet || git commit -m "chore(funding): 펀딩 데이터 갱신"
          git pull --rebase
          git push
