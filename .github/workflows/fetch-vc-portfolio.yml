name: fetch-vc-portfolio

on:
  schedule:
    - cron: "0 18 * * 6" # 매주 일요일 03:00 KST
  workflow_dispatch:
    inputs:
      only:
        description: "특정 운용사만(이름 일부, 비우면 전체)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-vc-portfolio
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 저장소 의존성(package.json)은 건드리지 않고 크롤러 실행에만 Playwright를 설치한다.
      - name: Playwright 설치
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: 운용사 포트폴리오 수집
        run: node scripts/fetch-vc-portfolio.mjs ${{ github.event.inputs.only && format('--only={0}', github.event.inputs.only) || '' }}

      - name: 결과 커밋
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/vc-portfolio.json public/data/vc-portfolio-changes.json data/vc-portfolio-state.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            N=$(node -e "const d=require('./public/data/vc-portfolio-changes.json').runs[0];process.stdout.write(d.ok+'/'+d.checked+' 성공, 신규 '+d.added.length)")
            git commit -m "chore(vc-portfolio): 운용사 포트폴리오 주간 갱신 (${N})"
            git pull --rebase origin main
            git push
          fi
