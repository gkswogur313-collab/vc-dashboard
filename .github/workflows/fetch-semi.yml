name: fetch-semi

on:
  schedule:
    - cron: "52 21 * * *"    # 매일 06:52 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-semi
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 반도체 브리핑 — 전문지·뉴스레터·구글 뉴스 피드 수집
        run: node scripts/fetch-semi.mjs

      - name: public/data/semi/feed.json 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/semi/feed.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            N=$(node -e "process.stdout.write(String(require('./public/data/semi/feed.json').count))")
            git commit -m "chore(반도체): 피드 갱신 (${N}건)"
            git pull --rebase
            git push
          fi
