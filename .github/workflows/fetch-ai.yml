name: fetch-ai

on:
  schedule:
    - cron: "4 22 * * *"     # 매일 07:04 KST
  workflow_dispatch:
  push:                     # 피드 목록·수집기를 고치면 바로 재수집
    branches: [main]
    paths:
      - scripts/fetch-ai.mjs
      - scripts/ai/feeds.json
      - .github/workflows/fetch-ai.yml

permissions:
  contents: write

concurrency:
  group: fetch-ai
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: AI 브리핑 — 전문지·뉴스레터·기업 블로그·구글 뉴스 피드 수집
        run: node scripts/fetch-ai.mjs

      - name: public/data/ai/feed.json 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ai/feed.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            N=$(node -e "process.stdout.write(String(require('./public/data/ai/feed.json').count))")
            git commit -m "chore(AI): 피드 갱신 (${N}건)"
            git pull --rebase
            git push
          fi
